name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    name: "PHPUnit: MW ${{ matrix.mw }}, PHP ${{ matrix.php }}"
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Matches DataTrek's actual live environment (MediaWiki 1.43.9,
          # PHP 8.5.4 -- confirmed from this project's own debug log and
          # `composer test` output, not assumed) rather than an arbitrary
          # version. This is the one that has to pass.
          - mw: 'REL1_43'
            php: '8.5'
            experimental: false
          # Canary only: catches future breakage against MediaWiki's own
          # trunk early, same philosophy as the real precedent this
          # workflow is adapted from (ProfessionalWiki/WikibaseLocalMedia).
          # Allowed to fail -- it tests against a moving target, not a
          # version this extension claims to support.
          - mw: 'master'
            php: '8.5'
            experimental: true

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mediawiki

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          tools: composer:v2

      - name: Cache MediaWiki
        id: cache-mediawiki
        uses: actions/cache@v4
        with:
          path: |
            mediawiki
            !mediawiki/extensions/
            !mediawiki/vendor/
          key: mw_${{ matrix.mw }}-php${{ matrix.php }}_v1

      - name: Cache Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-php${{ matrix.php }}

      - uses: actions/checkout@v4
        with:
          path: EarlyCopy

      - name: Install MediaWiki + Wikibase (throwaway SQLite install)
        if: steps.cache-mediawiki.outputs.cache-hit != 'true'
        working-directory: ~
        run: bash EarlyCopy/.github/workflows/installMediaWiki.sh ${{ matrix.mw }} WikibaseBoolean

      - uses: actions/checkout@v4
        with:
          path: mediawiki/extensions/WikibaseBoolean

      - name: Composer update
        run: composer update

      - name: Run PHPUnit
        run: |
          # MediaWiki dropped tests/phpunit/phpunit.php in favour of a
          # generated config on some newer branches -- handle both, same
          # as the real precedent this is adapted from.
          if [ -f tests/phpunit/phpunit.php ]; then
            php tests/phpunit/phpunit.php extensions/WikibaseBoolean/tests/
          else
            composer phpunit:config
            vendor/bin/phpunit extensions/WikibaseBoolean/tests/
          fi